<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lubriluk - Gran Lanzamiento</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #001f3f;
            overflow-x: hidden;
        }
        .fade-in {
            animation: fadeIn 1s ease-out forwards;
            opacity: 0;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
    </style>
</head>
<body class="text-white selection:bg-orange-500/30">

    <!-- Elementos decorativos de fondo -->
    <div class="fixed inset-0 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-orange-500/5 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-white/5 rounded-full blur-[120px]"></div>
    </div>

    <div class="min-h-screen flex flex-col items-center justify-center px-6 py-12 relative z-10">
        
        <main class="container mx-auto max-w-4xl text-center">
            
            <!-- Logo -->
            <div class="fade-in mb-10">
                <img src="https://i.ibb.co/6cB9jMwM/Screenshot-20250620-225631-Enhance-Fox-1.jpg" 
                     alt="Lubriluk Logo" 
                     class="w-32 md:w-48 mx-auto rounded-3xl shadow-2xl border border-white/10">
            </div>

            <!-- Encabezado -->
            <div class="fade-in delay-1 mb-8">
                <span class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-orange-500/20 bg-orange-500/10 text-[10px] md:text-xs font-bold tracking-widest uppercase text-orange-500 mb-6">
                    <i data-lucide="timer" class="w-3 h-3"></i>
                    Gran Lanzamiento Oficial
                </span>
                
                <h1 class="text-4xl md:text-7xl font-black tracking-tighter mb-6 leading-tight uppercase">
                    Lubriluk <br>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-orange-600">
                        Nueva Experiencia
                    </span>
                </h1>
                
                <p class="text-gray-300 text-base md:text-lg max-w-xl mx-auto mb-10 font-medium leading-relaxed">
                    Cuidamos tu motor en Resistencia. Estamos actualizando nuestra web para ofrecerte lo mejor.
                </p>
            </div>

            <!-- Contador -->
            <div class="fade-in delay-2 grid grid-cols-4 gap-2 md:gap-6 mb-12 w-full max-w-3xl mx-auto">
                <div class="bg-white/5 border border-white/10 rounded-xl md:rounded-2xl p-3 md:p-6 backdrop-blur-md">
                    <div id="days" class="text-2xl md:text-5xl font-black mb-1 text-orange-500">00</div>
                    <div class="text-[8px] md:text-[10px] uppercase tracking-widest text-gray-400 font-bold">Días</div>
                </div>
                <div class="bg-white/5 border border-white/10 rounded-xl md:rounded-2xl p-3 md:p-6 backdrop-blur-md">
                    <div id="hours" class="text-2xl md:text-5xl font-black mb-1 text-orange-500">00</div>
                    <div class="text-[8px] md:text-[10px] uppercase tracking-widest text-gray-400 font-bold">Horas</div>
                </div>
                <div class="bg-white/5 border border-white/10 rounded-xl md:rounded-2xl p-3 md:p-6 backdrop-blur-md">
                    <div id="minutes" class="text-2xl md:text-5xl font-black mb-1 text-orange-500">00</div>
                    <div class="text-[8px] md:text-[10px] uppercase tracking-widest text-gray-400 font-bold">Minutos</div>
                </div>
                <div class="bg-white/5 border border-white/10 rounded-xl md:rounded-2xl p-3 md:p-6 backdrop-blur-md">
                    <div id="seconds" class="text-2xl md:text-5xl font-black mb-1 text-orange-500">00</div>
                    <div class="text-[8px] md:text-[10px] uppercase tracking-widest text-gray-400 font-bold">Segundos</div>
                </div>
            </div>

            <!-- Acciones -->
            <div class="fade-in delay-3 flex flex-col items-center gap-8 w-full max-w-md mx-auto">
                <div class="flex items-center gap-3 text-white bg-white/5 px-6 py-3 rounded-full border border-white/10 backdrop-blur-sm">
                    <i data-lucide="calendar" class="w-5 h-5 text-orange-500"></i>
                    <span class="font-bold text-sm">Lunes 16 de Marzo, 2026</span>
                </div>

                <div class="flex flex-col w-full gap-4">
                    <a href="https://wa.me/5493624104432" 
                       target="_blank"
                       class="flex items-center justify-center gap-3 w-full bg-[#25D366] text-white px-8 py-5 rounded-2xl font-black text-sm uppercase tracking-widest shadow-xl transition-all hover:scale-[1.02] active:scale-95 hover:bg-[#20ba5a]">
                        <i data-lucide="message-circle" class="w-5 h-5"></i>
                        Consultas por WhatsApp
                    </a>
                    
                    <a href="https://maps.app.goo.gl/MESwyLbpb9AJk2hPA?g_st=ac" 
                       target="_blank"
                       class="flex items-center justify-center gap-2 text-orange-500 font-black text-xs uppercase tracking-widest hover:text-orange-400 transition-colors group">
                        <i data-lucide="map-pin" class="w-4 h-4"></i>
                        Ver ubicación en Google Maps
                    </a>
                </div>
            </div>
        </main>

        <footer class="mt-12 text-gray-500 text-[10px] tracking-[0.2em] uppercase font-bold">
            &copy; 2026 Lubriluk &bull; Resistencia, Chaco
        </footer>
    </div>

    <script>
        // Inicializar iconos
        lucide.createIcons();

        // Lógica del contador
        const launchDate = new Date("March 16, 2026 00:00:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = String(days).padStart(2, '0');
            document.getElementById("hours").innerHTML = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerHTML = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerHTML = String(seconds).padStart(2, '0');

            if (distance < 0) {
                clearInterval(timer);
                document.querySelector(".grid").innerHTML = "<div class='col-span-4 text-2xl font-bold uppercase tracking-widest text-orange-500'>¡Ya estamos en línea!</div>";
            }
        }, 1000);
    </script>
</body>
</html>
